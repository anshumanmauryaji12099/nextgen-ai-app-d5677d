<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Offline · NEXTGEN AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d10;
        color: #f1f2ec;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 20px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 20px 0 8px;
      }
      p {
        color: #a3a7b0;
        max-width: 28rem;
        line-height: 1.6;
        margin: 0 auto 24px;
      }
      a {
        display: inline-block;
        background: #c8f031;
        color: #1a2208;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        This page hasn't been saved for offline use yet. Your conversations are
        stored on this device and are safe. Reconnect to keep working with AI.
      </p>
      <a href="/chat">Open saved chats</a>
    </main>
  </body>
</html>
